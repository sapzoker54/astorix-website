<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTORIX™ — Offline</title>
<style>
  :root {
    --bg: #07090F;
    --surface: #0D1117;
    --blue: #3B82F6;
    --text: #E2E8F0;
    --muted: #64748B;
    --border: rgba(59,130,246,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .logo {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #3B82F6, #2DD4BF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .tm { font-size: 0.4em; vertical-align: super; -webkit-text-fill-color: var(--muted); }
  .tagline {
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 48px;
  }
  .offline-icon {
    width: 80px;
    height: 80px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    background: var(--surface);
  }
  .offline-icon svg { width: 36px; height: 36px; opacity: 0.5; }
  h1 {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    margin-bottom: 16px;
  }
  p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.7;
    max-width: 420px;
    margin: 0 auto 40px;
  }
  .retry-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .retry-btn:hover { opacity: 0.85; }
  .footer {
    margin-top: 64px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="logo">ASTORIX<span class="tm">™</span></div>
  <div class="tagline">Enterprise AI Platform</div>

  <div class="offline-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p>ASTORIX requires an internet connection to deliver real-time AI intelligence. Please reconnect and try again.</p>

  <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>

  <div class="footer">
    ASTORIX™ · Gensis.AI Inc. · USPTO SN 99639401 (Pending)
  </div>
</body>
</html>
