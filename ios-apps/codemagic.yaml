          cat > "$ICON_DST/Contents.json" <<'EOF'
          {"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"Icon-1024.png","scale":"1x"}],"info":{"author":"xcode","version":1}}
          EOF
      - name: Build iOS app
        script: |
          cd $APP_DIR
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/cityinfra.xcarchive" \
            DEVELOPMENT_TEAM=GV32459XCX \
            PRODUCT_BUNDLE_IDENTIFIER=ai.astorix.cityinfra \
            CODE_SIGN_STYLE=Automatic \
            | xcpretty
      - name: Export .ipa
        script: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store</string><key>teamID</key><string>GV32459XCX</string></dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/cityinfra.xcarchive" \
            -exportPath "$CM_BUILD_DIR/cityinfra-ipa" \
            -exportOptionsPlist /tmp/ExportOptions.plist | xcpretty
    artifacts:
      - "$CM_BUILD_DIR/cityinfra-ipa/*.ipa"
    publishing:
      <<: *app_store_publishing
      email:
        recipients: [ashreekar@gmail.com]
        notify: { success: true, failure: true }

